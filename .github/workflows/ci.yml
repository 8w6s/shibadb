name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300

  mingw-cross-build:
    name: Windows cross-build (MinGW)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Configure
        run: cmake --preset mingw
      - name: Build all Windows targets
        run: cmake --build --preset mingw --parallel

  sanitizers:
    name: Sanitizers (ASan+UBSan)
    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset sanitize
      - name: Build
        run: cmake --build --preset sanitize --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --preset sanitize --output-on-failure

  thread-sanitizer:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset tsan
      - name: Build
        run: cmake --build --preset tsan --parallel
      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-tsan --output-on-failure --timeout 600

  fuzz-smoke:
    name: Fuzz smoke (replay corpus)
    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset fuzz
      - name: Build
        run: cmake --build --preset fuzz --parallel
      - name: Replay corpus through each harness
        run: |
          set -e
          for harness in superblock page btree_page xchacha20poly1305 \
                         encrypted_envelope wal_recover pager_open; do
            echo "== fuzz_$harness =="
            ./build-fuzz/fuzz_$harness fuzz/corpus-$harness -runs=0
          done

  native-portability:
    name: Native (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macOS
          - os: windows-latest
            platform: Windows
    steps:
      - uses: actions/checkout@v4
      # The native ctest suite is pure C now (the Python binding was removed),
      # so no Python is needed here. Windows uses the Ninja generator, which
      # needs the MSVC toolchain on PATH — set it up via the dev-cmd action.
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 1800 --no-tests=error
