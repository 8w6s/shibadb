name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300

  mingw-cross-build:
    name: Windows cross-build (MinGW)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Configure
        run: cmake --preset mingw
      - name: Build all Windows targets
        run: cmake --build --preset mingw --parallel

  sanitizers:
    name: Sanitizers (ASan+UBSan)
    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset sanitize
      - name: Build
        run: cmake --build --preset sanitize --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --preset sanitize --output-on-failure

  thread-sanitizer:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset tsan
      - name: Build
        run: cmake --build --preset tsan --parallel
      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-tsan --output-on-failure --timeout 600

  fuzz-smoke:
    name: Fuzz smoke (replay + short fuzz)
    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset fuzz
      - name: Build
        run: cmake --build --preset fuzz --parallel
      - name: Replay corpus and short-fuzz each harness
        run: |
          set -e
          for harness in superblock page btree_page xchacha20poly1305 \
                         encrypted_envelope wal_recover pager_open; do
            echo "== fuzz_$harness =="
            corpus="fuzz/corpus-$harness"
            # A corpus that is missing or empty makes `-runs=0` "pass" without
            # executing a single input, silently hiding loss of coverage. Fail
            # loudly instead.
            if [ ! -d "$corpus" ] || [ -z "$(ls -A "$corpus" 2>/dev/null)" ]; then
              echo "::error::seed corpus $corpus is missing or empty"
              exit 1
            fi
            # 1) Replay the seed corpus (regression check on known inputs).
            ./build-fuzz/fuzz_$harness "$corpus" -runs=0
            # 2) Actually fuzz for a short budget so NEW inputs are generated
            #    every push — this is what catches a regression a change
            #    introduces, which pure -runs=0 replay cannot. A crash makes
            #    libFuzzer exit non-zero and fails the job.
            ./build-fuzz/fuzz_$harness "$corpus" \
              -max_total_time=30 -print_final_stats=1
          done

  native-portability:
    name: Native (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macOS
          - os: windows-latest
            platform: Windows
    steps:
      - uses: actions/checkout@v4
      # The binding came back in c7a9aa8, so the suite is no longer pure C: the
      # python_* tests need an interpreter with pytest, and CMake skips
      # registering them when Python3 is absent — which is how they went
      # unnoticed. Windows uses the Ninja generator, which needs the MSVC
      # toolchain on PATH: set it up via the dev-cmd action.
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 1800 --no-tests=error
